name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server-unit-tests:
    name: MCP Server Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd mcp_server
          pip install -e ".[dev]" || pip install -e . pytest pytest-asyncio anyio

      - name: Run MCP server pytest suite
        run: |
          cd mcp_server
          pytest -v

  live-bpy-tests:
    name: Live In-Blender (bpy) Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and install Blender LTS
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxrender1 libgl1 libglx-mesa0 libegl1
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf blender-4.2.0-linux-x64.tar.xz
          echo "$PWD/blender-4.2.0-linux-x64" >> $GITHUB_PATH

      - name: Run live bpy test suite
        run: |
          python scripts/run_live_bpy_tests.py

  build-addon-extension:
    name: Package Blender Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build extension zip
        run: |
          python scripts/build_extension.py --force-python
